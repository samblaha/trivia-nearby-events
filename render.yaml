# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trivia-nearby-events
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: EVENTS_API_HOST
        value: "0.0.0.0"
